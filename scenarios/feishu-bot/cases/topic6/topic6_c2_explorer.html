<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic6 C2 · 事件归档流程检查器</title>
<style>
  :root {
    --ink: #18212f;
    --muted: #64748b;
    --line: #d8e0ea;
    --paper: #ffffff;
    --canvas: #f4f7fb;
    --navy: #163a5f;
    --blue: #1f6fd1;
    --blue-soft: #e8f1fc;
    --teal: #0f766e;
    --teal-soft: #e5f5f2;
    --amber: #a45b09;
    --amber-soft: #fff4df;
    --violet: #6944a5;
    --violet-soft: #f0ebfa;
    --code: #122033;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--canvas);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Microsoft YaHei", sans-serif;
  }

  button, input { font: inherit; }

  .shell {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 16px 24px;
    background: var(--navy);
    color: #fff;
  }

  .eyebrow {
    margin: 0 0 3px;
    color: #bcd7f5;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.25;
  }

  .subhead {
    margin: 5px 0 0;
    color: #c7d5e6;
    font-size: 12px;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }

  .top-link, .reset-button {
    min-height: 32px;
    padding: 5px 10px;
    border: 1px solid rgba(255, 255, 255, .32);
    border-radius: 5px;
    color: #fff;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    text-decoration: none;
  }

  .top-link:hover, .reset-button:hover { background: rgba(255, 255, 255, .12); }

  .workspace {
    display: grid;
    grid-template-columns: 286px minmax(460px, 1fr) minmax(370px, 33vw);
    min-height: 0;
    overflow: hidden;
  }

  .stage-nav, .detail-panel {
    overflow-y: auto;
    background: var(--paper);
  }

  .stage-nav {
    border-right: 1px solid var(--line);
    padding: 18px 12px 24px;
  }

  .nav-heading {
    padding: 0 8px 12px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
  }

  .stage-list { display: grid; gap: 3px; }

  .stage-button {
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr);
    gap: 9px;
    width: 100%;
    padding: 9px 8px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    color: inherit;
    background: transparent;
    text-align: left;
    cursor: pointer;
  }

  .stage-button:hover { background: #f4f7fb; }
  .stage-button[aria-current="true"] {
    border-color: #a8c9ed;
    background: var(--blue-soft);
  }

  .stage-code {
    align-self: start;
    padding-top: 1px;
    color: var(--blue);
    font: 700 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .stage-name { display: block; font-weight: 650; }
  .stage-meta { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; }

  .flow-panel {
    overflow: auto;
    padding: 28px clamp(24px, 4vw, 56px);
    background:
      linear-gradient(90deg, rgba(28, 70, 111, .045) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(rgba(28, 70, 111, .045) 1px, transparent 1px) 0 0 / 48px 48px,
      var(--canvas);
  }

  .flow-header {
    max-width: 920px;
    margin: 0 auto 20px;
  }

  .flow-header h2 { margin: 0; font-size: 18px; }
  .flow-header p { margin: 6px 0 0; color: var(--muted); }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
  }

  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-mark { width: 10px; height: 10px; border-radius: 50%; }
  .legend-mark.chat { background: var(--blue); }
  .legend-mark.embedding { background: var(--violet); }
  .legend-mark.local { background: var(--teal); }

  .flow {
    display: grid;
    gap: 14px;
    width: min(920px, 100%);
    margin: 0 auto;
  }

  .flow-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    position: relative;
  }

  .flow-row.single { grid-template-columns: minmax(0, 1fr); }
  .flow-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .parallel-caption {
    margin: 0 0 8px;
    color: var(--teal);
    font-size: 12px;
    font-weight: 700;
    text-align: center;
  }

  .connector {
    width: 1px;
    height: 22px;
    margin: -1px auto -1px;
    background: #9aacbf;
    position: relative;
  }

  .connector::after {
    position: absolute;
    left: -4px;
    bottom: -1px;
    width: 0;
    height: 0;
    border-top: 6px solid #9aacbf;
    border-right: 4px solid transparent;
    border-left: 4px solid transparent;
    content: "";
  }

  .flow-node {
    min-height: 100px;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    box-shadow: 0 2px 7px rgba(19, 39, 65, .05);
    cursor: pointer;
    text-align: left;
    transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  }

  .flow-node:hover {
    transform: translateY(-2px);
    border-color: #86b5e6;
    box-shadow: 0 7px 18px rgba(19, 39, 65, .1);
  }

  .flow-node.selected {
    border: 2px solid var(--blue);
    padding: 12px;
    box-shadow: 0 0 0 4px rgba(31, 111, 209, .12);
  }

  .flow-node[data-kind="embedding"] .kind { color: var(--violet); background: var(--violet-soft); }
  .flow-node[data-kind="local"] .kind { color: var(--teal); background: var(--teal-soft); }
  .flow-node[data-kind="conditional"] .kind { color: var(--amber); background: var(--amber-soft); }

  .node-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .node-id { color: var(--blue); font: 700 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .kind {
    padding: 1px 6px;
    border-radius: 99px;
    color: var(--blue);
    background: var(--blue-soft);
    font-size: 10px;
    font-weight: 700;
  }

  .node-name { display: block; margin-top: 8px; font-weight: 700; }
  .node-io { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; }

  .detail-panel {
    border-left: 1px solid var(--line);
    background: #fbfcfe;
  }

  .detail-sticky {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--line);
    background: rgba(251, 252, 254, .96);
    backdrop-filter: blur(8px);
  }

  .detail-kicker {
    margin: 0 0 3px;
    color: var(--blue);
    font: 700 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .detail-title { margin: 0; font-size: 20px; line-height: 1.3; }
  .detail-summary { margin: 7px 0 0; color: var(--muted); font-size: 13px; }

  .tabs {
    display: flex;
    gap: 5px;
    margin-top: 14px;
  }

  .tab {
    padding: 5px 8px;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    background: transparent;
    cursor: pointer;
    font-size: 12px;
  }

  .tab.active { border-bottom-color: var(--blue); color: var(--blue); font-weight: 700; }

  .detail-content { padding: 18px 22px 30px; }
  .tab-page { display: none; }
  .tab-page.active { display: block; }

  .fact-grid { display: grid; gap: 10px; }
  .fact {
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
  }

  .fact-label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 700; }
  .fact-value { color: var(--ink); font-size: 13px; }

  h3 {
    margin: 20px 0 8px;
    color: var(--navy);
    font-size: 13px;
  }

  .notice {
    padding: 10px 12px;
    border-left: 3px solid var(--teal);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: #24534d;
    background: var(--teal-soft);
    font-size: 12px;
  }

  .code-card {
    overflow-x: auto;
    margin: 8px 0 0;
    padding: 12px;
    border-radius: var(--radius);
    color: #d9e8fa;
    background: var(--code);
    font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre;
  }

  .data-card {
    display: grid;
    gap: 0;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--paper);
  }

  .data-row {
    display: grid;
    grid-template-columns: minmax(112px, 36%) minmax(0, 1fr);
    border-bottom: 1px solid var(--line);
  }

  .data-row:last-child { border-bottom: 0; }

  .data-key {
    padding: 9px 10px;
    color: var(--navy);
    background: #f3f7fc;
    font-size: 12px;
    font-weight: 700;
  }

  .data-key code {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 500;
  }

  .data-value {
    min-width: 0;
    padding: 9px 10px;
    color: #334155;
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .data-value .data-card {
    margin: 0;
    border-color: #dce6f1;
  }

  .value-empty { color: var(--muted); font-style: italic; }
  .value-number { color: var(--violet); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .value-bool { color: var(--teal); font-weight: 700; }

  .array-list {
    display: grid;
    gap: 6px;
  }

  .array-item {
    padding: 7px 8px;
    border: 1px solid #dce6f1;
    border-radius: 6px;
    background: #f9fbfe;
  }

  .array-item .data-card { margin: 0; }
  .array-index { margin-bottom: 4px; color: var(--muted); font: 10px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }

  .plain-card {
    margin-top: 8px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: #334155;
    background: var(--paper);
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .file-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
  .file-list li {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
  }

  .file-label { display: block; color: var(--muted); font-size: 10px; font-weight: 700; }
  .file-path { display: block; margin-top: 2px; color: var(--navy); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }

  .mini-list { margin: 0; padding-left: 18px; color: #334155; font-size: 12px; }
  .mini-list li + li { margin-top: 5px; }

  .empty { color: var(--muted); padding: 30px 0; text-align: center; }

  @media (max-width: 1100px) {
    .workspace { grid-template-columns: 230px minmax(420px, 1fr); }
    .detail-panel { grid-column: 1 / -1; max-height: 52vh; border-top: 1px solid var(--line); border-left: 0; }
    .detail-sticky { position: static; }
  }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .shell { height: auto; min-height: 100vh; overflow: visible; }
    .topbar { align-items: flex-start; padding: 14px; }
    .top-actions { display: none; }
    .workspace { display: block; overflow: visible; }
    .stage-nav { overflow-x: auto; padding: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
    .nav-heading { display: none; }
    .stage-list { display: flex; width: max-content; gap: 6px; }
    .stage-button { display: block; width: 108px; min-height: 72px; }
    .stage-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flow-panel { padding: 22px 14px; }
    .flow-row { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
    .flow-row.single { grid-template-columns: 1fr; }
    .flow-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .flow-panel, .detail-panel { overflow: visible; }
    .detail-panel { max-height: none; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Topic6 / C2 event registry</p>
      <h1>事件归档流程检查器</h1>
      <p class="subhead">点击节点，查看读取文件、模型真实输入、结构化输出、写盘位置与并发边界。</p>
    </div>
    <div class="top-actions">
      <a class="top-link" href="./topic6_pipeline_overview.html">返回全景流程</a>
      <button class="reset-button" id="reset-view" type="button">回到总览</button>
    </div>
  </header>

  <section class="workspace">
    <nav class="stage-nav" aria-label="C2 阶段">
      <div class="nav-heading">按阶段查看</div>
      <div class="stage-list" id="stage-list"></div>
    </nav>

    <section class="flow-panel" aria-label="C2 流程图">
      <div class="flow-header">
        <h2>从可用热点到事件归属</h2>
        <p>除 `00` 的四个平台外，所有阶段严格串行。节点卡片中的并发数仅指该节点内部的请求或 batch 并发。</p>
        <div class="legend">
          <span class="legend-item"><i class="legend-mark chat"></i>Chat</span>
          <span class="legend-item"><i class="legend-mark embedding"></i>Embedding</span>
          <span class="legend-item"><i class="legend-mark local"></i>本地处理</span>
        </div>
      </div>

      <div class="flow" id="flow">
        <div class="flow-row single">
          <button class="flow-node" data-stage="input" data-kind="local" type="button">
            <span class="node-top"><span class="node-id">入口</span><span class="kind">本地</span></span>
            <span class="node-name">可用热点子集</span>
            <span class="node-io">XLSX → input.csv</span>
          </button>
        </div>
        <div class="connector"></div>
        <p class="parallel-caption">只有 00：四个平台可并行</p>
        <div class="flow-row" id="row-00"></div>
        <div class="connector"></div>
        <div class="flow-row single">
          <button class="flow-node" data-stage="x0" data-kind="local" type="button">
            <span class="node-top"><span class="node-id">x0</span><span class="kind">本地</span></span>
            <span class="node-name">四平台合流</span>
            <span class="node-io">四份 JSONL → 一份 JSONL</span>
          </button>
        </div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-01"></div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-02"></div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-03"></div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-04"></div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-05"></div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-06"></div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-07"></div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-x2"></div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-x3"></div>
        <div class="connector"></div>
        <div class="flow-row single" id="row-x4"></div>
      </div>
    </section>

    <aside class="detail-panel" aria-live="polite">
      <div class="detail-sticky">
        <p class="detail-kicker" id="detail-kicker">C2 / 总览</p>
        <h2 class="detail-title" id="detail-title">选择一个节点</h2>
        <p class="detail-summary" id="detail-summary">右侧将显示该节点的实际数据边界，而不是泛化后的流程描述。</p>
        <div class="tabs" role="tablist" aria-label="详情标签">
          <button class="tab active" type="button" data-tab="facts" role="tab">边界</button>
          <button class="tab" type="button" data-tab="payload" role="tab">Payload</button>
          <button class="tab" type="button" data-tab="files" role="tab">文件</button>
        </div>
      </div>
      <div class="detail-content">
        <section class="tab-page active" data-page="facts"></section>
        <section class="tab-page" data-page="payload"></section>
        <section class="tab-page" data-page="files"></section>
      </div>
    </aside>
  </section>
</main>

<script>
  const ROOT = "04_标注/C2_事件归档/c2_run";
  const full = (path) => `${ROOT}/${path}`;

  const stages = {
    input: {
      id: "入口", name: "可用热点子集转 C2 输入", kind: "local",
      kindLabel: "本地 Pandas", concurrency: "单进程，秒级",
      summary: "C2 的唯一入口。读取上游可用热点 XLSX，仅保留事件归档真正需要的四列，再写为 CSV。",
      reads: ["04_标注/_可用子集/usable_subset_{mode}_r{N}.xlsx"],
      writes: ["input.csv"],
      model: "不调用模型",
      local: "读取 XLSX；将 record_id、platform、title、heat 映射为固定列名；校验 record_id 唯一、平台只属于微博/抖音/B站/知乎。",
      modelInput: "无",
      modelOutput: "无",
      exampleIn: `record_id,platform,title,heat\nW39_weibo_012,微博,苹果发布 iPhone 17 系列,98.6`,
      exampleOut: `record_id,platform,title,heat\nW39_weibo_012,微博,苹果发布 iPhone 17 系列,98.6`,
      notes: ["上游宽表中其它列不会进入 C2。", "C2 后续所有节点都以 input.csv 的记录集合为覆盖基准。"]
    },
    "00-weibo": {
      id: "00 / 微博", name: "标题清洗", kind: "chat",
      kindLabel: "Ark Chat", concurrency: "平台进程并行；当前每平台 4 路、50 条/批",
      summary: "按平台规则剥除标题包装，只删不加。微博子进程从同一 input.csv 中本地筛出微博记录。",
      reads: ["input.csv"],
      writes: ["weibo/raw/clean/CLxxxx.json", "weibo/work/clean_titles.jsonl", "weibo/out/00_clean_titles.csv"],
      model: "system = 固定的标题清洗规则 + 微博平台规则；user = record_id 与原标题。",
      local: "按 heat 排序；本地校验模型结果是否新增字符/错误改写。校验失败会回退到原标题。",
      modelInput: `W39_weibo_012\t苹果发布 iPhone 17 系列`,
      modelOutput: `{"records":[{"record_id":"W39_weibo_012","clean_title":"苹果发布 iPhone 17 系列","ops":["NONE"]}]}`,
      exampleIn: `{"record_id":"W39_weibo_012","platform":"微博","title":"苹果发布 iPhone 17 系列","heat":98.6}`,
      exampleOut: `{"record_id":"W39_weibo_012","platform":"微博","title":"苹果发布 iPhone 17 系列","clean_title":"苹果发布 iPhone 17 系列","ops":["NONE"],"flags":[],"reverted":false,"heat":98.6}`,
      notes: ["模型 user payload 不含 platform 与 heat。平台规则进入 system prompt；heat 只用于本地排序。", "抖音/B站/知乎执行相同脚本，但 system 中的平台规则不同，输出文件位于各自目录。"]
    },
    x0: {
      id: "x0", name: "四平台合流", kind: "local",
      kindLabel: "本地 JSONL", concurrency: "单进程，秒级",
      summary: "把四个平台完成清洗后的 JSONL 合并为共享输入。后续 01 至 x4 不再按平台分别执行。",
      reads: ["weibo/work/clean_titles.jsonl", "douyin/work/clean_titles.jsonl", "bilibili/work/clean_titles.jsonl", "zhihu/work/clean_titles.jsonl"],
      writes: ["merged/work/clean_titles.jsonl", "merged/out/x0_合流后清洗结果.csv"],
      model: "不调用模型",
      local: "合并并保留每条记录已有字段；检查跨平台 record_id 不重复。",
      modelInput: "无",
      modelOutput: "无",
      exampleIn: `四份 JSONL，每行均含 record_id / platform / title / clean_title / heat`,
      exampleOut: `一份 merged/work/clean_titles.jsonl，字段不变，只是记录集合合并。`,
      notes: ["x0 不更新原始文件，而是生成 merged 目录下的新文件。"]
    },
    "01": {
      id: "01", name: "事件性判定", kind: "chat",
      kindLabel: "Ark Chat", concurrency: "当前 4 路，60 条/批",
      summary: "判定每条清洗后标题是否指向现实事件：EVENT、NON_EVENT 或 UNCERTAIN。",

  function renderValue(value) {
    if (value === null || value === undefined || value === "") {
      return `<span class="value-empty">无</span>`;
    }
    if (Array.isArray(value)) {
      if (!value.length) return `<span class="value-empty">空列表</span>`;
      if (value.every((item) => typeof item !== "object" || item === null)) {
        return value.map((item) => `<span class="array-item">${escapeHtml(item)}</span>`).join(" ");
      }
      return `<div class="array-list">${value.map((item, index) => `
        <div class="array-item"><div class="array-index">第 ${index + 1} 项</div>${renderValue(item)}</div>
      `).join("")}</div>`;
    }
    if (typeof value === "object") {
      return `<div class="data-card">${Object.entries(value).map(([key, child]) => `
        <div class="data-row">
          <div class="data-key">${escapeHtml(fieldLabel(key))}<code>${escapeHtml(key)}</code></div>
          <div class="data-value">${renderValue(child)}</div>
        </div>
      `).join("")}</div>`;
    }
    if (typeof value === "boolean") {
      return `<span class="value-bool">${value ? "是" : "否"}</span>`;
    }
    if (typeof value === "number") {
      return `<span class="value-number">${escapeHtml(value)}</span>`;
    }
    return escapeHtml(value);
  }

  function renderPayload(raw) {
    if (raw === "无") return `<div class="notice">本节点不调用外部模型或 API。</div>`;
    try {

    } catch {

      <div class="fact-grid">
        <div class="fact"><span class="fact-label">执行方式</span><span class="fact-value">${escapeHtml(item.kindLabel)}</span></div>
        <div class="fact"><span class="fact-label">节点内并发</span><span class="fact-value">${escapeHtml(item.concurrency)}</span></div>
        <div class="fact"><span class="fact-label">模型边界</span><span class="fact-value">${escapeHtml(item.model)}</span></div>
      </div>
      <h3>本地做什么</h3>
      <div class="notice">${escapeHtml(item.local)}</div>
      <h3>关键约束</h3>
      <ul class="mini-list">${item.notes.map((note) => `<li>${escapeHtml(note)}</li>`).join("")}</ul>`;

    document.querySelector('[data-page="payload"]').innerHTML = `
      <h3>节点读取到的记录样例</h3>
      ${renderPayload(item.exampleIn)}
      <h3>实际发送给模型 / API</h3>
      ${renderPayload(item.modelInput)}
      <h3>模型 / 本地处理后的输出</h3>
      ${renderPayload(item.modelOutput)}
      <h3>最终写入的记录样例</h3>
      ${renderPayload(item.exampleOut)}`;

    document.querySelector('[data-page="files"]').innerHTML = `
      <h3>读取</h3>${fileList(item.reads, "读取")}
      <h3>写入或更新</h3>${fileList(item.writes, "写入 / 更新")}
      <h3>文件语义</h3>
      <ul class="mini-list">
        <li><code>raw/</code>：每个模型 batch 的可续跑缓存。</li>
        <li><code>work/</code>：下一节点消费的机器中间产物。</li>
        <li><code>out/</code>：面向人工检查的 CSV 明细或审计表。</li>
      </ul>`;

    document.querySelectorAll("[data-stage]").forEach((element) => {
      const current = element.dataset.stage === selected;
      element.classList.toggle("selected", current && element.classList.contains("flow-node"));
      if (element.classList.contains("stage-button")) element.setAttribute("aria-current", current ? "true" : "false");
    });
    document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === activeTab));
    document.querySelectorAll(".tab-page").forEach((page) => page.classList.toggle("active", page.dataset.page === activeTab));
  }

  populateNavigation();
  renderDetails();

  document.addEventListener("click", (event) => {
    const stageButton = event.target.closest("[data-stage]");
    if (stageButton) {
      selected = stageButton.dataset.stage;
      renderDetails();
    }
    const tab = event.target.closest("[data-tab]");
    if (tab) {
      activeTab = tab.dataset.tab;
      renderDetails();
    }
  });

  document.querySelector("#reset-view").addEventListener("click", () => {
    selected = "input";
    activeTab = "facts";
    renderDetails();
  });
</script>
</body>
</html>
