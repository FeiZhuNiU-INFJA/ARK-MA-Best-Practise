name: Deploy scenario pages

on:
  push:
    branches:
      - de
    paths:
      - "scenarios/index.html"
      - "scenarios/feishu-bot/cases/topic6/topic6_ma_architecture.html"
      - "scenarios/feishu-bot/cases/topic6/topic6_pipeline_overview.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build public artifact
        run: |
          mkdir -p _site/feishu-bot/cases/topic6
          cp scenarios/index.html _site/index.html
          cp scenarios/feishu-bot/cases/topic6/topic6_ma_architecture.html _site/feishu-bot/cases/topic6/
          cp scenarios/feishu-bot/cases/topic6/topic6_pipeline_overview.html _site/feishu-bot/cases/topic6/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
